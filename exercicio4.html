<body>

    <p>Exercício 4. Verificar se número está dentro de um intervalo</p>

            id="numeroaverificar"

    <div>

            type="button"
            id="botao4"
            onclick="intervalo()">

    <div id="resultado4" class="alert alert-primary" role="alert">
        Aqui sairá o resultado
    </div>
